name: Bug report
description: Report a reproducible installation or processing failure
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and a short reproduction. Do not attach private footage.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python, FFmpeg, model/device, and output of `python -m videocolor doctor`. Remove personal paths.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Command and error
      description: Paste settings and the error message, removing private names, paths, and credentials.
    validations:
      required: true
